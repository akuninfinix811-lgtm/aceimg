    /* =====================================================
       AMBIL ?id=
       ===================================================== */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const matchId =
      (params.get("id") || "")
        .trim()
        .toLowerCase();


    /* =====================================================
       PLAYER AKTIF
       ===================================================== */

    const activeMatch =
      matches[matchId] || {
        title: "Live Stream",
        src: ""
      };


    /* =====================================================
       VIDEO
       ===================================================== */

    const video =
      document.getElementById(
        "video-player"
      );


    /* =====================================================
       JUDUL
       ===================================================== */

    document.title =
      "Sports77HD - " +
      activeMatch.title;


    const pageTitle =
      document.getElementById(
        "page-title"
      );

    if (pageTitle) {
      pageTitle.textContent =
        "Sports77HD - " +
        activeMatch.title;
    }


    /* =====================================================
       PEMUTARAN
       ===================================================== */

    let hls = null;


    if (activeMatch.src) {

      /*
       * M3U8
       */

      if (
        activeMatch.src
          .toLowerCase()
          .includes(".m3u8")
      ) {

        /*
         * HLS native
         */

        if (
          video.canPlayType(
            "application/vnd.apple.mpegurl"
          )
        ) {

          video.src =
            activeMatch.src;

        }

        /*
         * HLS.js
         */

        else if (
          typeof Hls !== "undefined" &&
          Hls.isSupported()
        ) {

          hls =
            new Hls();

          hls.loadSource(
            activeMatch.src
          );

          hls.attachMedia(
            video
          );

          hls.on(
            Hls.Events.MANIFEST_PARSED,
            function () {

              video.play().catch(
                function () {}
              );

            }
          );

        }

      }

      /*
       * MP4
       */

      else {

        video.src =
          activeMatch.src;

        video.load();

        video.play().catch(
          function () {}
        );

      }

    }
