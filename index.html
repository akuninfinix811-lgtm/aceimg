<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title id="page-title">RedFlix</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>

<body>

  <!-- ================= HEADER ================= -->
  <header class="header">
    <div class="header-inner">

      <div class="logo">
        Red<span>Flix</span>
      </div>

      <div class="search-wrapper">
        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="Cari film..."
          autocomplete="off"
        >
      </div>

    </div>
  </header>


  <!-- ================= HERO ================= -->
  <section class="hero">

    <div class="hero-media">
      <video
        id="heroVideo"
        muted
        playsinline
        preload="metadata"
      ></video>

      <div class="hero-gradient"></div>
    </div>

    <div class="hero-content">

      <div class="featured-label">
        FEATURED
      </div>

      <h1 id="heroTitle">
        RedFlix
      </h1>

      <p id="heroDescription">
        Temukan film dan series pilihanmu.
      </p>

      <div class="hero-actions">

        <button
          type="button"
          class="btn btn-red"
          id="heroPlayBtn"
        >
          ▶ Play
        </button>

        <button
          type="button"
          class="btn btn-dark"
          id="heroInfoBtn"
        >
          ℹ Info
        </button>

      </div>

    </div>
  </section>


  <!-- ================= CONTENT ================= -->
  <main class="content">

    <div class="filter-bar">

      <button
        type="button"
        class="filter-btn active"
        data-filter="all"
      >
        Semua
      </button>

      <button
        type="button"
        class="filter-btn"
        data-filter="movie"
      >
        Film
      </button>

      <button
        type="button"
        class="filter-btn"
        data-filter="series"
      >
        Series
      </button>

    </div>


    <!-- ================= MOVIES ================= -->
    <section class="catalog-section">

      <div class="section-heading">
        <h2>Film</h2>
      </div>

      <div
        id="movieGrid"
        class="video-grid"
      ></div>

    </section>


    <!-- ================= SERIES ================= -->
    <section class="catalog-section">

      <div class="section-heading">
        <h2>Series</h2>
      </div>

      <div
        id="seriesGrid"
        class="video-grid"
      ></div>

    </section>


    <!-- ================= EMPTY ================= -->
    <div
      id="emptyState"
      class="empty-state hidden"
    >
      <div class="empty-icon">×</div>

      <h3>Tidak ditemukan</h3>

      <p>
        Film atau series yang kamu cari tidak tersedia.
      </p>
    </div>

  </main>


  <!-- ================= DETAIL MODAL ================= -->
  <div
    id="detailModal"
    class="modal hidden"
    aria-hidden="true"
  >

    <div
      class="modal-backdrop"
      data-close-detail
    ></div>

    <div class="detail-modal">

      <button
        type="button"
        class="modal-close"
        data-close-detail
        aria-label="Tutup"
      >
        ×
      </button>

      <div class="detail-video">

        <video
          id="detailVideo"
          muted
          playsinline
          preload="metadata"
          controls
        ></video>

      </div>

      <div class="detail-body">

        <span
          id="detailType"
          class="badge"
        >
          MOVIE
        </span>

        <h2 id="detailTitle">
          -
        </h2>

        <div class="detail-meta">

          <span id="detailYear">
            -
          </span>

          <span>•</span>

          <span id="detailRating">
            -
          </span>

          <span>•</span>

          <span id="detailGenre">
            -
          </span>

        </div>

        <p id="detailDescription">
          -
        </p>

        <div class="cast">
          <strong>Pemeran:</strong>
          <span id="detailCast">
            -
          </span>
        </div>

        <button
          type="button"
          class="btn btn-red"
          id="detailPlayBtn"
        >
          ▶ Play Sekarang
        </button>

      </div>

    </div>

  </div>


  <!-- ================= PLAYER MODAL ================= -->
  <div
    id="playerModal"
    class="player-modal hidden"
    aria-hidden="true"
  >

    <button
      type="button"
      id="playerClose"
      class="player-close"
      aria-label="Tutup player"
    >
      ×
    </button>

    <div class="player-box">

      <video
        id="mainPlayer"
        controls
        playsinline
        preload="metadata"
      ></video>

      <div
        id="playerError"
        class="player-error hidden"
      >
        Video tidak dapat diputar.
      </div>

    </div>

  </div>


  <!-- ================= FOOTER ================= -->
  <footer class="footer">

    <div class="footer-inner">

      <div class="footer-logo">
        Red<span>Flix</span>
      </div>

      <p>
        © 2026 RedFlix. All rights reserved.
      </p>

    </div>

  </footer>


  <script src="movie.js"></script>
  <script src="script.js"></script>

</body>
</html>
