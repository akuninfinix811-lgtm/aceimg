<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title id="page-title">RedFlix Stream</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =====================================================
       HEADER
  ====================================================== -->
  <header class="site-header">

    <div class="logo">
      RED<span>FLIX</span>
    </div>

    <div class="search-box">
      <input
        type="search"
        id="searchInput"
        placeholder="Cari film atau series..."
        autocomplete="off"
      >
    </div>

  </header>


  <!-- =====================================================
       HERO
  ====================================================== -->
  <section class="hero">

    <video
      id="heroVideo"
      autoplay
      muted
      loop
      playsinline
      preload="metadata"
    ></video>

    <div class="hero-overlay"></div>

    <div class="hero-content">

      <h1 id="heroTitle">RedFlix</h1>

      <p id="heroDescription">
        Saksikan video pilihan terbaru.
      </p>

      <div class="hero-buttons">

        <button
          type="button"
          id="heroPlayBtn"
          class="btn btn-primary"
        >
          ▶ Putar
        </button>

        <button
          type="button"
          id="heroInfoBtn"
          class="btn btn-secondary"
        >
          ⓘ Info
        </button>

      </div>

    </div>

  </section>


  <!-- =====================================================
       FILTER
  ====================================================== -->
  <div class="filter-container">

    <button
      type="button"
      class="filter-btn active"
      data-filter="all"
    >
      Semua
    </button>

    <button
      type="button"
      class="filter-btn"
      data-filter="movie"
    >
      Film
    </button>

    <button
      type="button"
      class="filter-btn"
      data-filter="series"
    >
      Series
    </button>

  </div>


  <!-- =====================================================
       CONTENT
  ====================================================== -->
  <main class="content">

    <!-- FILM -->
    <section
      id="movieSection"
      class="content-section"
    >

      <h2>Film</h2>

      <div
        id="movieGrid"
        class="video-grid"
      ></div>

    </section>


    <!-- SERIES -->
    <section
      id="seriesSection"
      class="content-section"
    >

      <h2>Series</h2>

      <div
        id="seriesGrid"
        class="video-grid"
      ></div>

    </section>


    <!-- EMPTY -->
    <div
      id="emptyState"
      class="empty-state hidden"
    >
      <h3>Video tidak ditemukan</h3>
      <p>Coba gunakan kata kunci lain.</p>
    </div>

  </main>


  <!-- =====================================================
       DETAIL MODAL
  ====================================================== -->
  <div
    id="detailModal"
    class="modal hidden"
  >

    <div
      class="modal-backdrop"
      data-close-detail
    ></div>

    <div class="detail-modal-content">

      <button
        type="button"
        class="modal-close"
        data-close-detail
        aria-label="Tutup"
      >
        ×
      </button>

      <div class="detail-video-container">

        <video
          id="detailVideo"
          muted
          playsinline
          controls
          preload="metadata"
        ></video>

      </div>

      <div class="detail-content">

        <h2 id="detailTitle">
          Judul
        </h2>

        <div class="detail-meta">

          <span id="detailYear"></span>

          <span>•</span>

          <span id="detailGenre"></span>

          <span>•</span>

          <span id="detailRating"></span>

          <span>•</span>

          <span id="detailType"></span>

        </div>

        <p id="detailDescription"></p>

        <p>
          <strong>Pemeran:</strong>
          <span id="detailCast">-</span>
        </p>

        <button
          type="button"
          id="detailPlayBtn"
          class="btn btn-primary"
        >
          ▶ Putar Sekarang
        </button>

      </div>

    </div>

  </div>


  <!-- =====================================================
       PLAYER MODAL
  ====================================================== -->
  <div
    id="playerModal"
    class="player-modal hidden"
  >

    <button
      type="button"
      id="playerClose"
      class="player-close"
      aria-label="Tutup player"
    >
      ×
    </button>


    <div class="player-container">

      <!-- VIDEO + OVERLAY -->
      <div class="player-video-wrap">

        <video
          id="mainPlayer"
          controls
          playsinline
          preload="metadata"
        ></video>


        <!--
          Overlay transparan.
          Klik pertama membuka iklan.
          Setelah itu overlay hilang.
        -->
        <div
          id="ad-overlay"
          role="button"
          aria-label="Lanjutkan ke video"
        ></div>

      </div>


      <div
        id="playerError"
        class="player-error hidden"
      >
        Video tidak dapat diputar.
      </div>

    </div>

  </div>


  <!-- =====================================================
       HLS.JS
  ====================================================== -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <!-- DATA VIDEO -->
  <script src="movie.js"></script>

  <!-- MAIN SCRIPT -->
  <script src="script.js"></script>

</body>
</html>
