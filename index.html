<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RedFlix</title>

  <meta
    name="description"
    content="RedFlix - Website streaming dengan tema hitam dan merah."
  >

  <link rel="stylesheet" href="style.css">

  <!-- HLS.js untuk video .m3u8 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>

<body>

  <!-- ================= HEADER ================= -->

  <header class="header">
    <div class="container header-inner">

      <a href="#" class="logo">
        <span>RED</span>FLIX
      </a>

      <div class="search-wrapper">
        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="Cari film atau series..."
          autocomplete="off"
        >
      </div>

    </div>
  </header>


  <!-- ================= MAIN ================= -->

  <main>

    <!-- ================= HERO ================= -->

    <section class="hero">

      <div class="hero-video">
        <video
          id="heroVideo"
          muted
          autoplay
          loop
          playsinline
          preload="metadata"
        ></video>

        <div class="hero-overlay"></div>
      </div>

      <div class="container hero-content">

        <span class="hero-label">
          FEATURED
        </span>

        <h1 id="heroTitle">
          RedFlix
        </h1>

        <p id="heroDescription">
          Saksikan film dan series favorit kamu.
        </p>

        <div class="hero-buttons">

          <button
            type="button"
            class="btn btn-red"
            id="heroPlayBtn"
          >
            ▶ Mulai Nonton
          </button>

          <button
            type="button"
            class="btn btn-dark"
            id="heroInfoBtn"
          >
            ℹ Detail
          </button>

        </div>

      </div>

    </section>


    <!-- ================= CONTENT ================= -->

    <section class="content-section">

      <div class="container">

        <!-- FILTER -->

        <div class="filter-bar">

          <button
            class="filter-btn active"
            data-filter="all"
          >
            Semua
          </button>

          <button
            class="filter-btn"
            data-filter="movie"
          >
            Film
          </button>

          <button
            class="filter-btn"
            data-filter="series"
          >
            Series
          </button>

        </div>


        <!-- FILM -->

        <section class="catalog-section">

          <div class="section-title">
            <h2>Film</h2>
          </div>

          <div
            id="movieGrid"
            class="video-grid"
          ></div>

        </section>


        <!-- SERIES -->

        <section class="catalog-section">

          <div class="section-title">
            <h2>Series</h2>
          </div>

          <div
            id="seriesGrid"
            class="video-grid"
          ></div>

        </section>


        <!-- EMPTY -->

        <div
          id="emptyState"
          class="empty-state hidden"
        >
          <div class="empty-icon">
            ×
          </div>

          <h3>
            Film tidak ditemukan
          </h3>

          <p>
            Coba gunakan kata kunci pencarian yang berbeda.
          </p>
        </div>

      </div>

    </section>

  </main>


  <!-- ================= DETAIL MODAL ================= -->

  <div
    id="detailModal"
    class="modal hidden"
    aria-hidden="true"
  >

    <div class="modal-backdrop"></div>

    <div class="modal-box detail-box">

      <button
        type="button"
        class="modal-close"
        data-close="detailModal"
        aria-label="Tutup"
      >
        ×
      </button>

      <div class="detail-video-wrapper">

        <video
          id="detailVideo"
          controls
          playsinline
          preload="metadata"
        ></video>

      </div>

      <div class="detail-content">

        <span
          id="detailType"
          class="badge"
        >
          FILM
        </span>

        <h2 id="detailTitle">
          Judul
        </h2>

        <div class="detail-meta">

          <span id="detailYear">
            2026
          </span>

          <span>•</span>

          <span id="detailGenre">
            Action
          </span>

          <span>•</span>

          <span id="detailRating">
            ★ 8.0
          </span>

        </div>

        <p id="detailDescription">
          Deskripsi film.
        </p>

        <p class="cast">
          <strong>Pemeran:</strong>
          <span id="detailCast">
            -
          </span>
        </p>

        <button
          type="button"
          id="detailPlayBtn"
          class="btn btn-red"
        >
          ▶ Tonton Sekarang
        </button>

      </div>

    </div>

  </div>


  <!-- ================= FULL PLAYER ================= -->

  <div
    id="playerModal"
    class="player-modal hidden"
    aria-hidden="true"
  >

    <button
      type="button"
      class="player-close"
      data-close="playerModal"
      aria-label="Tutup player"
    >
      ×
    </button>

    <div class="player-container">

      <video
        id="mainPlayer"
        class="main-player"
        controls
        playsinline
        preload="metadata"
      ></video>

      <div
        id="playerError"
        class="player-error hidden"
      >
        Video tidak dapat diputar.
      </div>

    </div>

  </div>


  <!-- ================= FOOTER ================= -->

  <footer class="footer">

    <div class="container footer-inner">

      <div class="footer-logo">
        <span>RED</span>FLIX
      </div>

      <p>
        © 2026 RedFlix. Semua hak dilindungi.
      </p>

    </div>

  </footer>


  <script src="movies.js"></script>
  <script src="script.js"></script>

</body>
</html>
