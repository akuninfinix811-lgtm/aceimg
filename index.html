<!DOCTYPE html>

<head>

  <!-- HLS.js Library untuk memutar format .m3u8 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000;
      color: #fff;
    }

    /* STREAM PLAYER */
    .stream-box {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 300px;
      background: #000;
      overflow: hidden;
    }

    .stream-box video {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
    }

    /* OVERLAY IKLAN CLICKUNDER */
    #ad-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #ad-overlay.hidden {
      display: none;
    }
  </style>
</head>

    /* =========================
       PARSING PARAMETER URL (?id=)
       ========================= */
    const params = new URLSearchParams(window.location.search);
    const matchId = (params.get("id") || "").trim().toLowerCase();

    const fallbackMatch = { title: "Live Stream", src: "" };
    const activeMatch = matches[matchId] || fallbackMatch;

    /* =========================
       PEMUTARAN VIDEO
       ========================= */
    const video = document.getElementById("video-player");

    if (activeMatch.src) {
      if (activeMatch.src.includes(".m3u8")) {
        if (Hls.isSupported()) {
          const hls = new Hls();
          hls.loadSource(activeMatch.src);
          hls.attachMedia(video);
        } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
          // Dukungan native untuk Safari / iOS
          video.src = activeMatch.src;
        }
      } else {
        // Direct stream file .mp4
        video.src = activeMatch.src;
      }
    }

    // Update judul halaman
    document.title = "RedFlix - " + activeMatch.title;
    const pageTitleEl = document.getElementById("page-title");
    if (pageTitleEl) {
      pageTitleEl.textContent = "RedFlix - " + activeMatch.title;
    }

    /* =========================
       IKLAN SHOPEE (CLICKUNDER)
       ========================= */
    const overlay = document.getElementById("ad-overlay");
    const SHOPEE_URL = "https://s.shopee.co.id/8plcY8LGXi";
    let adOpened = false;

    overlay.addEventListener("click", function () {
      if (adOpened) return;

      adOpened = true;
      window.open(SHOPEE_URL, "_blank", "noopener,noreferrer");
      overlay.classList.add("hidden");
      video.play().catch(() => {});
    }, { once: true });
  </script>
