    };

    /* =========================
       PARSING PARAMETER URL (?id=)
       ========================= */
    const params = new URLSearchParams(window.location.search);
    const matchId = (params.get("id") || "").trim().toLowerCase();

    const fallbackMatch = { title: "Live Stream", src: "" };
    const activeMatch = matches[matchId] || fallbackMatch;

    /* =========================
       PEMUTARAN VIDEO
       ========================= */
    const video = document.getElementById("video-player");

    if (activeMatch.src) {
      if (activeMatch.src.includes(".m3u8")) {
        if (Hls.isSupported()) {
          const hls = new Hls();
          hls.loadSource(activeMatch.src);
          hls.attachMedia(video);
        } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
          video.src = activeMatch.src;
        }
      } else {
        video.src = activeMatch.src;
      }
    }

    // Update judul halaman
    document.title = "RedFlix - " + activeMatch.title;
    const pageTitleEl = document.getElementById("page-title");
    if (pageTitleEl) {
      pageTitleEl.textContent = "RedFlix - " + activeMatch.title;
    }

    /* =========================
       IKLAN OTOMATIS TEPAT DI DETIK KE-2
       ========================= */
    const SHOPEE_URL = "https://s.shopee.co.id/8plcY8LGXi";
    let adOpened = false;

    // Memantau waktu pemutaran video secara real-time
    video.addEventListener("timeupdate", function () {
      // Buka iklan tepat saat durasi pemutaran mencapai/melewati 2 detik
      if (video.currentTime >= 2 && !adOpened) {
        adOpened = true;

        // Buka tab baru berisi tautan Shopee
        const newWin = window.open(SHOPEE_URL, "_blank");

        // Cadangan (fallback): Jika tab baru diblokir oleh browser, alihkan halaman utama langsung
        if (!newWin || newWin.closed || typeof newWin.closed === "undefined") {
          window.location.href = SHOPEE_URL;
        }
      }
    });
  </script>
