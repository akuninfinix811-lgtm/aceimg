<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title id="page-title">Sports77HD Stream</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #000;
    }

    body {
      overflow-x: hidden;
    }

    /* =========================
       WHATSAPP BANNER
       ========================= */

    .wa-banner {
      width: 100%;
      height: 58px;

      display: flex;
      align-items: center;

      gap: 9px;
      padding: 7px 10px;

      background: linear-gradient(
        90deg,
        #075e25,
        #16a34a
      );

      color: #fff;
      text-decoration: none;

      overflow: hidden;
    }

    .wa-icon {
      width: 38px;
      height: 38px;
      min-width: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #fff;
      border-radius: 50%;

      font-size: 21px;
    }

    .wa-content {
      flex: 1;
      min-width: 0;

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .wa-title {
      font-size: 13px;
      font-weight: 800;
      line-height: 16px;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .wa-title span {
      color: #6dff91;
    }

    .wa-subtitle {
      margin-top: 2px;

      font-size: 9px;
      line-height: 12px;

      opacity: .9;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .wa-join {
      flex-shrink: 0;

      padding: 7px 12px;

      background: #fff;
      color: #128c3a;

      border-radius: 18px;

      font-size: 10px;
      font-weight: 800;
    }

    /* =========================
       STREAM
       ========================= */

    .stream-box {
      position: relative;

      width: 100%;
      height: calc(100vh - 58px);

      min-height: 300px;

      background: #000;

      overflow: hidden;
    }

    .stream-box iframe {
      display: block;

      width: 100%;
      height: 100%;

      border: 0;

      background: #000;

      touch-action: auto;
    }

    /* =========================
       IKLAN - SENTUH PERTAMA
       ========================= */

    #ad-overlay {
      position: absolute;

      inset: 0;

      z-index: 10;

      background: transparent;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

    #ad-overlay.hidden {
      display: none;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 480px) {

      .wa-banner {
        height: 58px;
        padding: 7px 9px;
        gap: 8px;
      }

      .wa-icon {
        width: 36px;
        height: 36px;
        min-width: 36px;

        font-size: 19px;
      }

      .wa-title {
        font-size: 12px;
      }

      .wa-subtitle {
        font-size: 8px;
      }

      .wa-join {
        padding: 7px 10px;
        font-size: 9px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       WHATSAPP
       ========================= -->

  <a
    href="https://whatsapp.com/channel/0029Vb81XCS1t90j9iA6z93L"
    target="_blank"
    rel="noopener noreferrer"
    class="wa-banner"
  >

    <div class="wa-icon">
      💬
    </div>

    <div class="wa-content">

      <div class="wa-title">
        Join Saluran
        <span>WhatsApp Pemersatu bangsa</span>
      </div>

      <div class="wa-subtitle">
        Dapatkan update video Pemersatu Bangsa,
        jadwal & info terbaru!
      </div>

    </div>

    <div class="wa-join">
      JOIN
    </div>

  </a>


  <!-- =========================
       STREAM
       ========================= -->

  <main class="stream-box">

    <iframe
      id="video-iframe"
      src="about:blank"
      title="Live Stream"
      allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
      allowfullscreen>
    </iframe>

    <!--
      Menangkap sentuhan pertama.
      Setelah diklik, overlay langsung hilang.
    -->
    <div
      id="ad-overlay"
      role="button"
      aria-label="Lanjutkan ke video"
    ></div>

  </main>


  <script>

    /* =========================
       DAFTAR PERTANDINGAN
       ========================= */

    const matches = {

      "desah": {
        title: "Lecce vs AS Roma",
        src: "https://vidlyx.lol/f/njxsmadq3s?_src=twitter%2Fx~social&_tw=1"
      },

      "proplayer2": {
        title: "Aston Villa vs Arsenal",
        src: "tribunvideo.com/f/o4pyluax3d4"
      },

      "proplayer1": {
        title: "Barcelona vs Vallecano",
        src: "tribunvideo.com/f/ccyvim9v0u7"
      },

      "priplayer3": {
        title: "Aston Villa vs Arsenal",
        src: "tribunvideo.com/f/5quuw0w8as8"
      },

      "tembem": {
        title: "Real Madrid vs Malaga",
        src: "https://autumn-field-e635.andinirosalin3.workers.dev"
      },

      "napoli": {
        title: "Napoli vs Como",
        src: "https://starballtv010.blogspot.com/2026/08/naco.html"
      },

      "deportivo": {
        title: "Deportivo vs Valencia",
        src: "https://starballtv010.blogspot.com/2026/08/lava.html"
      },

      "alqadsiah": {
        title: "Al Qadsiah vs Al Faisaly",
        src: "https://starballtv010.blogspot.com/2026/08/qafa.html"
      },

      "intermilan": {
        title: "Cagliari vs Inter Milan",
        src: "https://starballtv010.blogspot.com/2026/08/cain.html"
      },

      "gogo": {
        title: "Lazio vs Genoa",
        src: "https://sabutv.com/server/event.m3u8?ch=12&proxy=1"
      },

      "viral": {
        title: "AS Monaco vs Marseille",
        src: "https://aceimg.com/upload/?f=v5yPsxHaU.mp4"
      },

      "mentok": {
        title: "MotoGP",
        src: "https://aceimg.com/upload/?f=3i5f3YUWh.mp4"
      },

      "sp": {
        title: "Celta vs Athletic Bilbao",
        src: "https://aceimg.com/upload/?f=jQ4piDo7n.mp4"
      }

    };


    /* =========================
       AMBIL ?id=
       ========================= */

    const params =
      new URLSearchParams(window.location.search);

    const matchId =
      (params.get("id") || "")
        .trim()
        .toLowerCase();


    /* =========================
       FALLBACK
       ========================= */

    const fallbackMatch = {
      title: "Live Stream",
      src: "about:blank"
    };


    /* =========================
       PILIH STREAM
       ========================= */

    const activeMatch =
      matches[matchId] || fallbackMatch;


    /* =========================
       LOAD IFRAME
       ========================= */

    const iframe =
      document.getElementById("video-iframe");

    iframe.src = activeMatch.src;


    /* =========================
       JUDUL
       ========================= */

    document.title =
      "Sports77HD - " + activeMatch.title;

    document.getElementById("page-title")
      .textContent =
      "Sports77HD - " + activeMatch.title;


    /* =========================
       IKLAN SHOPEE
       ========================= */

    const overlay =
      document.getElementById("ad-overlay");

    const SHOPEE_URL =
      "https://s.shopee.co.id/2gAtB1h0zd";


    let adOpened = false;


    overlay.addEventListener(
      "click",
      function () {

        if (adOpened) {
          return;
        }

        adOpened = true;

        /*
          Buka iklan dari aksi klik user.
        */
        window.open(
          SHOPEE_URL,
          "_blank",
          "noopener,noreferrer"
        );

        /*
          Lepaskan overlay setelah
          klik pertama.
        */
        overlay.classList.add("hidden");

      },
      {
        once: true
      }
    );

  </script>

</body>
</html>
