<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RedFlix</title>

  <meta
    name="description"
    content="RedFlix - Streaming film dan series."
  >

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-inner">

      <a href="#" class="logo">
        <span>RED</span>FLIX
      </a>

      <div class="search-wrapper">
        <input
          id="searchInput"
          class="search-input"
          type="search"
          placeholder="Cari film atau series..."
          autocomplete="off"
        >
      </div>

    </div>
  </header>


  <!-- HERO -->
  <section class="hero">

    <div class="hero-media">

      <video
        id="heroVideo"
        muted
        autoplay
        loop
        playsinline
        preload="metadata"
      ></video>

      <div class="hero-gradient"></div>

    </div>


    <div class="hero-content">

      <div class="featured-label">
        FEATURED
      </div>

      <h1 id="heroTitle">
        RedFlix
      </h1>

      <p id="heroDescription">
        Saksikan film dan series favoritmu.
      </p>

      <div class="hero-actions">

        <button
          id="heroPlayBtn"
          class="btn btn-red"
          type="button"
        >
          ▶ Mulai Nonton
        </button>

        <button
          id="heroInfoBtn"
          class="btn btn-dark"
          type="button"
        >
          ℹ Detail
        </button>

      </div>

    </div>

  </section>


  <!-- CONTENT -->
  <main class="content">

    <!-- FILTER -->
    <div class="filter-bar">

      <button
        class="filter-btn active"
        data-filter="all"
      >
        Semua
      </button>

      <button
        class="filter-btn"
        data-filter="movie"
      >
        Film
      </button>

      <button
        class="filter-btn"
        data-filter="series"
      >
        Series
      </button>

    </div>


    <!-- FILM -->
    <section
      id="movieSection"
      class="catalog-section"
    >

      <div class="section-heading">
        <h2>Film</h2>
      </div>

      <div
        id="movieGrid"
        class="video-grid"
      ></div>

    </section>


    <!-- SERIES -->
    <section
      id="seriesSection"
      class="catalog-section"
    >

      <div class="section-heading">
        <h2>Series</h2>
      </div>

      <div
        id="seriesGrid"
        class="video-grid"
      ></div>

    </section>


    <!-- EMPTY -->
    <div
      id="emptyState"
      class="empty-state hidden"
    >
      <div class="empty-icon">×</div>

      <h3>
        Tidak ditemukan
      </h3>

      <p>
        Coba cari dengan kata kunci lain.
      </p>
    </div>

  </main>


  <!-- DETAIL MODAL -->
  <div
    id="detailModal"
    class="modal hidden"
  >

    <div
      class="modal-backdrop"
      data-close-detail
    ></div>

    <div class="detail-modal">

      <button
        class="modal-close"
        data-close-detail
        type="button"
      >
        ×
      </button>

      <div class="detail-video">

        <video
          id="detailVideo"
          controls
          playsinline
          preload="metadata"
        ></video>

      </div>

      <div class="detail-body">

        <span
          id="detailType"
          class="badge"
        >
          FILM
        </span>

        <h2 id="detailTitle">
          Judul
        </h2>

        <div class="detail-meta">

          <span id="detailYear">
            2026
          </span>

          <span>•</span>

          <span id="detailGenre">
            Action
          </span>

          <span>•</span>

          <span id="detailRating">
            ★ 8.0
          </span>

        </div>

        <p id="detailDescription">
          Deskripsi.
        </p>

        <p class="cast">
          <strong>Pemeran:</strong>
          <span id="detailCast">-</span>
        </p>

        <button
          id="detailPlayBtn"
          class="btn btn-red"
          type="button"
        >
          ▶ Tonton Sekarang
        </button>

      </div>

    </div>

  </div>


  <!-- PLAYER -->
  <div
    id="playerModal"
    class="player-modal hidden"
  >

    <button
      id="playerClose"
      class="player-close"
      type="button"
    >
      ×
    </button>

    <div class="player-box">

      <video
        id="mainPlayer"
        controls
        playsinline
        preload="metadata"
      ></video>

      <div
        id="playerError"
        class="player-error hidden"
      >
        Video tidak dapat diputar.
      </div>

    </div>

  </div>


  <!-- FOOTER -->
  <footer class="footer">

    <div class="footer-inner">

      <div class="footer-logo">
        <span>RED</span>FLIX
      </div>

      <p>
        © 2026 RedFlix
      </p>

    </div>

  </footer>


  <script src="movie.js"></script>
  <script src="script.js"></script>

</body>
</html>
