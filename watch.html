<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <title>RedFlix</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    /* ================= HEADER ================= */

    .watch-header {
      width: 100%;
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      background: #000;
      border-bottom: 1px solid #222;
    }

    .watch-logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1.5px;
    }

    .watch-logo .red {
      color: #e50914;
    }

    .watch-logo .white {
      color: #fff;
    }

    /* ================= CONTENT ================= */

    .watch-container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 50px;
    }

    /* ================= PLAYER ================= */

    .watch-player {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
      border: 1px solid #222;
      border-radius: 8px;
    }

    #watchVideo {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
    }

    /*
      Overlay hanya menutupi area video,
      bukan seluruh halaman.

      Bagian bawah sengaja diberi ruang supaya
      kontrol video tetap bisa digunakan setelah
      iklan pertama dibuka.
    */

    #watchAdOverlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 52px;

      z-index: 20;

      background: transparent;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;

      touch-action: pan-y;
    }

    #watchAdOverlay.hidden {
      display: none;
    }

    /* ================= TITLE ================= */

    .watch-info {
      padding-top: 18px;
    }

    #watchTitle {
      font-size: 24px;
      line-height: 1.3;
      font-weight: 700;
      color: #fff;
    }

    .watch-meta {
      margin-top: 9px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: #888;
      font-size: 14px;
    }

    .watch-rating {
      color: #e50914;
      font-weight: 700;
    }

    #watchDescription {
      margin-top: 16px;
      color: #aaa;
      font-size: 15px;
      line-height: 1.6;
    }

    /* ================= ERROR ================= */

    #watchError {
      display: none;
      margin-top: 15px;
      padding: 14px;
      border: 1px solid #441111;
      border-radius: 7px;
      background: #100000;
      color: #ff6b6b;
      font-size: 14px;
    }

    #watchError.show {
      display: block;
    }

    /* ================= BACK ================= */

    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      margin-top: 20px;

      padding: 10px 16px;

      border: 1px solid #333;
      border-radius: 6px;

      background: #111;
      color: #fff;

      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .back-btn:hover {
      background: #e50914;
      border-color: #e50914;
    }

    /* ================= FOOTER ================= */

    .watch-footer {
      width: 100%;
      padding: 25px 20px;

      border-top: 1px solid #222;

      color: #666;
      font-size: 13px;
      text-align: center;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 600px) {

      .watch-header {
        height: 58px;
        padding: 0 16px;
      }

      .watch-logo {
        font-size: 25px;
      }

      .watch-container {
        padding: 16px 10px 35px;
      }

      .watch-player {
        border-radius: 0;
        border-left: 0;
        border-right: 0;
      }

      #watchTitle {
        font-size: 20px;
      }

      #watchDescription {
        font-size: 14px;
      }

      .back-btn {
        width: 100%;
      }

    }

  </style>
</head>


<body data-page="watch">


  <!-- ================= HEADER ================= -->

  <header class="watch-header">

    <div class="watch-logo">
      <span class="red">RED</span><span class="white">FLIX</span>
    </div>

  </header>


  <!-- ================= CONTENT ================= -->

  <main class="watch-container">


    <!-- ================= PLAYER ================= -->

    <div class="watch-player">

      <video
        id="watchVideo"
        playsinline
        controls
        preload="metadata"
      ></video>


      <!--
        Lapisan transparan khusus iklan.

        Klik pertama di area video:
        1. Buka iklan Shopee.
        2. Hilangkan overlay.
        3. Video mulai diputar.
      -->

      <div
        id="watchAdOverlay"
        role="button"
        aria-label="Tonton video"
      ></div>

    </div>


    <!-- ================= INFO ================= -->

    <section class="watch-info">

      <h1 id="watchTitle">
        Memuat video...
      </h1>


      <div class="watch-meta">

        <span id="watchYear"></span>

        <span>•</span>

        <span id="watchGenre"></span>

        <span>•</span>

        <span
          id="watchRating"
          class="watch-rating"
        ></span>

      </div>


      <p id="watchDescription"></p>


      <div id="watchError"></div>


      <a
        href="./"
        class="back-btn"
      >
        ← Kembali ke RedFlix
      </a>

    </section>

  </main>


  <!-- ================= FOOTER ================= -->

  <footer class="watch-footer">

    © 2026 RedFlix

  </footer>


  <!-- ================= HLS.JS ================= -->

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>


  <!-- ================= MOVIE DATA ================= -->

  <script src="movie.js"></script>


  <!-- ================= REDFLIX SCRIPT ================= -->

  <script src="script.js"></script>

</body>

</html>
